<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8">
        <title>test</title>
        <style>
            


           .btn {
             background: #ff7b00;
             color: #fff;
             padding: 12px 24px;
             border-radius: 8px;
             text-decoration: none;
             font-size: 18px;
             transition: 0.3s;
            }

            .btn:hover {
              background: #999795;
              transform: translateY(-120px);
            }


           .btn-shadow {
             background: #2ecc71;
             padding: 12px 25px;
             color: white;
             cursor: pointer;
             border-radius: 10px;
             box-shadow: 4px 6px 4px #27ae60;
             transition: 0.5s;
          }

          .btn-shadow:hover {
            box-shadow: 0 2px 0 #1e8449;
            transform: translateY(40px);
           } 


       .circle {
        width: 60px;
        height: 60px;
        background: #9b59b6;
        border-radius: 50%;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        cursor: pointer;
        }
        </style>
    </head>
    <body>
       

         <a href="#" class="btn"> h</a>

       <button class="btn-shadow"> sh</button>

       <div class="circle">OK</div>

    </body>
</html>
